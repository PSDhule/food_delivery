{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style2.css' %}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-nav">
  <div class="container">
    <a class="navbar-brand fw-bold logo" href="#">FoodRush</a>
  </div>
</nav>

<!-- Login Section -->
<section class="login-section">

    <div class="login-container">
      <h1 class="mb-5 text-white text-center">
        User Login
      </h1>

    <form method="POST">

      {% csrf_token %}

      <!-- Username -->
      <input type="text"
             name="username"
             placeholder="Enter Username"
             class="form-control mb-3"
             required>

      <!-- Password -->
      <input type="password"
             name="password"
             placeholder="Enter Password"
             class="form-control mb-3"
             required>

      <!-- Login Button -->
      <button type="submit"
          class="btn btn-warning w-100">
        Login
      </button>
    </form>

    <!-- Message -->
    <p class="text-center mt-3 text-success">
        {{ message }}
    </p>

    <!-- Signup Link -->
    <p class="text-center text-white mt-3">
        Don't have an account?
        <a href="/signup/" class="text-info text-decoration-none">
            Signup
        </a>
    </p>

  </div>

</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="{% static 'js/script.js' %}"></script>

</body>
</html>
