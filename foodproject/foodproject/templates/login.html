{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Login - FoodRush</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FoodRush CSS -->
<link rel="stylesheet" href="{% static 'css/style2.css' %}">
</head>


<body class="login-body">


<!-- =====================================================
     LOGIN NAVBAR
     Same style as index.html navbar
     ===================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark login-navbar">

    <div class="container">

        <!-- FoodRush Logo -->

        <a
            class="navbar-brand login-logo"
            href="{% url 'home' %}">
            FoodRush
        </a>


        <!-- Mobile Menu -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#loginNav"
            aria-controls="loginNav"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navbar Links -->

        <div
            class="collapse navbar-collapse"
            id="loginNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link login-nav-link"
                        href="{% url 'home' %}">
                        Home
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link login-nav-link active"
                        href="{% url 'login' %}">
                        Login
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link login-nav-link"
                        href="{% url 'signup' %}">
                        Signup
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- =====================================================
     LOGIN PAGE
     ===================================================== -->

<section class="login-section">


    <!-- Login Card -->

    <div class="login-container">


        <!-- Header -->

        <div class="login-card-header">

            <div class="login-icon">
                <span>🍴</span>
            </div>


            <h1>
                Welcome Back
            </h1>


            <p>
                Login to continue with FoodRush
            </p>

        </div>



        <!-- Error Message -->

        {% if message %}

        <div class="alert alert-danger login-alert">

            {{ message }}

        </div>

        {% endif %}



        <!-- Login Form -->

        <form method="POST">

            {% csrf_token %}


            <!-- Username -->

            <div class="login-input-group">

                <label for="username">
                    Username
                </label>


                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required>

            </div>



            <!-- Password -->

            <div class="login-input-group">

                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>



            <!-- Login Button -->

            <button
                type="submit"
                class="login-submit-btn">

                Login

            </button>

        </form>



        <!-- Signup Link -->

        <p class="login-signup-text">

            Don't have an account?

            <a href="{% url 'signup' %}">
                Signup
            </a>

        </p>


    </div>

</section>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
