{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Cart</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet"
      href="{% static 'css/style2.css' %}">

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-nav">

<div class="container">

<a class="navbar-brand fw-bold logo">
    FoodRush
</a>

<ul class="navbar-nav ms-auto">

<li class="nav-item">

<a href="/"
   class="nav-link active">

   Home

</a>

</li>

<li class="nav-item">

<a href="/search/"
   class="nav-link">

   Search

</a>

</li>

</ul>

</div>

</nav>

<!-- Cart Section -->
<section class="cart-section">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-md-6">

<div class="cart-box">

<h2 class="text-center mb-4">
    Cart Details
</h2>

<img src="{{ image.url }}"
    width="250"
    class="img-fluid rounded mb-4">

<h4 class="mt-3">
    Food :
    {{ food_name }}
</h4>

<h4 class="mt-3">
    Price :
    ₹ {{ price }}
</h4>

<h4 class="mt-3">
    Quantity :
    {{ quantity }}
</h4>

<h3 class="mt-4">
    Total :
    ₹ {{ total }}
</h3>

<a href="/payment/?food_name={{ food_name }}&price={{ price }}&quantity={{ quantity }}"
   class="btn btn-warning w-100 mt-4">

    Place Order

</a>

</div>

</div>

</div>

</div>

</section>

</body>
</html>
