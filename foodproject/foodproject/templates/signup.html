{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style2.css' %}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-nav">
  <div class="container">
    <a class="navbar-brand fw-bold logo" href="#">FoodRush</a>
  </div>
</nav>

<!-- Signup Section -->
<section class="signup_section d-flex justify-content-center align-items-center mt-2">

<div class="signup-box mt-5">

<h2 class="text-center mb-4">Create Account</h2>

<form method="POST">

    {% csrf_token %}

    <input type="text"
           name="username"
           class="form-control mb-3"
           placeholder="Enter Username"
           required>

    <input type="email"
           name="email"
           class="form-control mb-3"
           placeholder="Enter Email"
           required>

    <input type="password"
           name="password"
           class="form-control mb-3"
           placeholder="Enter Password"
           required>

    <input type="password"
           name="confirm_password"
           class="form-control mb-3"
           placeholder="Confirm Password"
           required>

    <button type="submit"
            class="btn btn-warning w-100">
        Signup
    </button>

</form>

<!-- Message -->
<p class="text-center mt-3 text-success">
    {{ message }}
</p>

<p class="text-center mt-3 text-white">
    Already have an account?
    <a href="/login/" class="text-info text-decoration-none">
        Login
    </a>
</p>

</div>

</section>

</body>
</html>
