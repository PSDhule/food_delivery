{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Signup - FoodRush</title>


<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FoodRush CSS -->

<link rel="stylesheet" href="{% static 'css/style2.css' %}">

</head>


<body class="signup-body">


<!-- =====================================================
     SIGNUP NAVBAR
     Same style as index.html navbar
     ===================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark signup-navbar">

    <div class="container">


        <!-- FoodRush Logo -->

        <a
            class="navbar-brand signup-logo"
            href="{% url 'home' %}">

            FoodRush

        </a>



        <!-- Mobile Menu -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#signupNav"
            aria-controls="signupNav"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>



        <!-- Navbar Links -->

        <div
            class="collapse navbar-collapse"
            id="signupNav">

            <ul class="navbar-nav ms-auto">


                <li class="nav-item">

                    <a
                        class="nav-link signup-nav-link"
                        href="{% url 'home' %}">

                        Home

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link signup-nav-link"
                        href="{% url 'login' %}">

                        Login

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link signup-nav-link active"
                        href="{% url 'signup' %}">

                        Signup

                    </a>

                </li>


            </ul>

        </div>

    </div>

</nav>



<!-- =====================================================
     SIGNUP PAGE
     ===================================================== -->

<section class="signup-section">


    <!-- Signup Card -->

    <div class="signup-box">


        <!-- Header -->

        <div class="signup-card-header">

            <div class="signup-icon">

                <span>🍴</span>

            </div>


            <h1>
                Create Account
            </h1>


            <p>
                Join FoodRush and order delicious food
            </p>

        </div>



        <!-- Error Message -->

        {% if message %}

        <div class="alert alert-danger signup-alert">

            {{ message }}

        </div>

        {% endif %}



        <!-- Signup Form -->

        <form method="POST">

            {% csrf_token %}


            <!-- Username -->

            <div class="signup-input-group">

                <label for="signup-username">
                    Username
                </label>


                <input
                    type="text"
                    id="signup-username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required>

            </div>



            <!-- Email -->

            <div class="signup-input-group">

                <label for="signup-email">
                    Email
                </label>


                <input
                    type="email"
                    id="signup-email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>



            <!-- Password -->

            <div class="signup-input-group">

                <label for="signup-password">
                    Password
                </label>


                <input
                    type="password"
                    id="signup-password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required>

            </div>



            <!-- Confirm Password -->

            <div class="signup-input-group">

                <label for="signup-confirm-password">
                    Confirm Password
                </label>


                <input
                    type="password"
                    id="signup-confirm-password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required>

            </div>



            <!-- Signup Button -->

            <button
                type="submit"
                class="signup-submit-btn">

                Create Account

            </button>

        </form>



        <!-- Login Link -->

        <p class="signup-login-text">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>


    </div>

</section>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
