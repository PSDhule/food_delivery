{% extends 'base.html' %}

{% block title %}Contact - FoodRush{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow mx-auto"
         style="max-width:700px;">

        <div class="card-body p-5">

            <h2 class="fw-bold text-center mb-4">
                Contact Us
            </h2>

            <form method="POST">

                {% csrf_token %}

                <input
                    type="text"
                    name="name"
                    class="form-control mb-3"
                    placeholder="Your Name"
                    required>

                <input
                    type="email"
                    name="email"
                    class="form-control mb-3"
                    placeholder="Your Email"
                    required>

                <textarea
                    name="message"
                    class="form-control mb-3"
                    rows="5"
                    placeholder="Your Message"
                    required></textarea>

                <button
                    class="btn btn-dark w-100">

                    Send Message

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
