{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Contact Us</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="{% static 'css/style2.css' %}">

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-nav">

<div class="container">

<a class="navbar-brand fw-bold logo">
    FoodRush
</a>

<ul class="navbar-nav ms-auto">

<li class="nav-item">

<a href="/"
   class="nav-link">

   Home

</a>

</li>

<li class="nav-item">

<a href="/myorder/"
   class="nav-link">

   My Orders

</a>

</li>

<li class="nav-item">

<a href="/contact/"
   class="nav-link active">

   Contact

</a>

</li>

</ul>

</div>

</nav>

<!-- Contact Section -->

<section class="contact-section">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-md-6">

<div class="contact-box">

<h1 class="text-center mb-4">
    Contact Us
</h1>

<form method="POST">

{% csrf_token %}

<input type="text"
       name="name"
       placeholder="Enter Your Name"
       class="form-control mb-3"
       required>

<input type="email"
       name="email"
       placeholder="Enter Your Email"
       class="form-control mb-3"
       required>

<textarea class="form-control mb-3"
          rows="5"
          name="message"
          placeholder="Enter Message"
          required></textarea>

<button class="btn btn-warning w-100">
    Send Message
</button>

</form>

<p class="text-center text-success mt-3">
    {{ message }}
</p>

</div>

</div>

</div>

</div>

</section>

</body>
</html>
