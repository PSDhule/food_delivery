{% extends 'base.html' %}

{% block title %}Payment Successful - FoodRush{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card payment-success-card mx-auto text-center" style="max-width:600px;">

        <div class="card-body p-5">

            <div class="payment-success-icon">
                ✅
            </div>

            <h1 class="fw-bold">
                Payment Successful
            </h1>

            <p>
                Your order has been confirmed.
            </p>

            <h5 class="payment-success-order">
                {{ order.order_number }}
            </h5>

            <h3 class="payment-success-total">
                ₹{{ order.total }}
            </h3>

            <a
                href="{% url 'order_detail' order.id %}"
                class="btn btn-dark mt-3">

                View Order

            </a>

        </div>

    </div>

</div>

{% endblock %}
