{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="{% static 'css/style2.css' %}">

</head>

<body>

<section class="cart-section">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-md-6">

<div class="cart-box text-center">

<h2 class="mb-4">
    Payment Page
</h2>

<img src="{{ image.url }}"
     width="250"
     class="img-fluid rounded mb-4">

<h4>
    {{ food_name }}
</h4>

<h4 class="mt-3">
    Total : ₹ {{ total }}
</h4>

<div class="form-check mt-4 text-start">

<input class="form-check-input"
       type="radio"
       checked>

<label class="form-check-label">
    Cash On Delivery
</label>

</div>

<a href="/placeorder/?food_name={{ food_name }}&price={{ price }}&quantity={{ quantity }}"
   class="btn btn-warning w-100 mt-4">

   Pay Now

</a>

</div>

</div>

</div>

</div>

</section>

</body>
</html>
